services:
  - type: web
    name: qc-system-monolith
    env: docker
    plan: free
    region: oregon
    healthCheckPath: /api/users # A stable api endpoint to check health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: qc-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false

databases:
  - name: qc-db
    plan: free
    region: oregon
